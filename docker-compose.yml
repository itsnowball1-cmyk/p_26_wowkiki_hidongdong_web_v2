services:
  db:
    image: postgres:17
    container_name: hidongdong-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: wowkiki
    ports:
      # 호스트 포트 충돌이 나면 좌측만 바꾸세요 (예: "5433:5432")
      # 그 경우 code/.env 의 DB_PORT 도 함께 변경
      - "5432:5432"
    volumes:
      - hidongdong-db-data:/var/lib/postgresql/data
      # 초기 데이터는 docker-entrypoint-initdb.d 자동 스크립트가 아니라
      # db/restore-dev-dump.sh 로 별도 복원한다 (실제 dev Postgres pgAdmin 백업, custom format).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wowkiki"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  hidongdong-db-data:
